[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prolog-ilp-diagnostics"
version = "1.0.0"
description = "Streamlit application for inductive logic programming diagnostics with SWI-Prolog"
requires-python = ">=3.11"
dependencies = [
    "streamlit==1.67.0",
    "pandas==3.1.1",
    "numpy==2.5.4",
    "scikit-learn==1.9.1",
    "matplotlib==3.11.2",
    "packaging==26.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.setuptools.packages.find]
include = ["core*", "ui*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
