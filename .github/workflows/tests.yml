name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install SWI-Prolog (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y swi-prolog-nox
      - name: Install SWI-Prolog (Windows)
        if: runner.os == 'Windows'
        run: choco install swi-prolog --no-progress -y
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Python and Streamlit tests
        run: python -m pytest -q
      - name: Run Prolog tests
        run: swipl -q -g "run_tests" -t halt prolog/tests.pl
